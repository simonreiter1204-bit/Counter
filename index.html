<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >
    <meta
        name="apple-mobile-web-app-title"
        content="Mein Counter"
    >

    <title>Mein Counter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #f2f2f7;
            color: #111;
        }

        h1 {
            text-align: center;
            margin: 10px 0 25px;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           COUNTER
           ========================= */

        #counter {
            text-align: center;
            font-size: 64px;
            font-weight: bold;
            margin: 15px 0 25px;
        }

        .counter-buttons {
            display: flex;
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 20px;
            font-weight: 600;

            background: #e5e5ea;
            color: #111;

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.96);
        }

        .counter-buttons button {
            flex: 1;
            font-size: 30px;
        }

        .reset,
        .clear-history {
            width: 100%;
            margin-top: 12px;
            font-size: 16px;
        }

        /* =========================
           BERECHNUNG
           ========================= */

        .function-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }

        .function-result span {
            font-size: 17px;
        }

        .function-result strong {
            font-size: 28px;
        }

        /* =========================
           ZEIT SEIT LETZTER FLUPPE
           ========================= */

        .time-result {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            padding: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        /* =========================
           EINGABEFELDER
           ========================= */

        .input-boxes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            padding: 14px;
            background: #f2f2f7;
            border-radius: 14px;
        }

        .input-box label {
            font-size: 17px;
            font-weight: 600;
        }

        .integer-input {
            width: 120px;
            padding: 12px;

            font-size: 18px;
            text-align: center;

            border: 1px solid #ccc;
            border-radius: 12px;

            background: white;
            color: #111;
        }

        /* =========================
           HISTORIE
           ========================= */

        .history {
            width: 100%;
            border-collapse: collapse;
        }

        .history th,
        .history td {
            padding: 10px 5px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .history th:last-child,
        .history td:last-child {
            text-align: right;
        }

        /* =========================
           UHR
           ========================= */

        #clock {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        #date {
            text-align: center;
            margin-top: 5px;
            color: #666;
            font-size: 17px;
        }

        /* =========================
           DARK MODE
           ========================= */

        @media (prefers-color-scheme: dark) {

            body {
                background: #000;
                color: white;
            }

            .card {
                background: #1c1c1e;
                box-shadow: none;
            }

            button {
                background: #2c2c2e;
                color: white;
            }

            .input-box {
                background: #2c2c2e;
            }

            .integer-input {
                background: #2c2c2e;
                color: white;
                border-color: #444;
            }

            .history th,
            .history td {
                border-color: #444;
            }

            #date {
                color: #aaa;
            }
        }
    </style>
</head>

<body>

    <h1>Mein Counter</h1>

    <!-- =========================
         COUNTER
         ========================= -->

    <div class="card">

        <h2>Counter</h2>

        <div id="counter">0</div>

        <div class="counter-buttons">

            <button onclick="changeCounter(-1)">
                −1
            </button>

            <button onclick="changeCounter(1)">
                +1
            </button>

        </div>

        <button
            class="reset"
            onclick="resetCounter()"
        >
            Counter zurücksetzen
        </button>

    </div>


    <!-- =========================
         HEUTE AUSGEGEBEN
         ========================= -->

    <div class="card">

        <h2>Heute ausgegeben</h2>

        <div class="function-result">

            <span>Ergebnis</span>

            <strong id="calculationResult">
                0,00 €
            </strong>

        </div>

    </div>


    <!-- =========================
         ZEIT SEIT LETZTER FLUPPE
         ========================= -->

    <div class="card">

        <h2>Zeit seit letzter Fluppe</h2>

        <div
            id="timeSinceChange"
            class="time-result"
        >
            00:00:00
        </div>

    </div>


    <!-- =========================
         DATENSATZWERTE
         ========================= -->

    <div class="card">

        <h2>Aktuelle Datensatzwerte</h2>

        <div class="input-boxes">

            <div class="input-box">

                <label for="value1">
                    Schachtelpreis
                </label>

                <input
                    class="integer-input"
                    id="value1"
                    type="number"
                    step="0.01"
                    min="0"
                    inputmode="decimal"
                    placeholder="0,00"
                >

            </div>


            <div class="input-box">

                <label for="value2">
                    Inhalt in Stück
                </label>

                <input
                    class="integer-input"
                    id="value2"
                    type="number"
                    step="1"
                    min="1"
                    inputmode="numeric"
                    placeholder="20"
                >

            </div>

        </div>

    </div>


    <!-- =========================
         TAGESHISTORIE
         ========================= -->

    <div class="card">

        <h2>Tageshistorie</h2>

        <table class="history">

            <thead>
                <tr>
                    <th>Datum</th>
                    <th>Wert</th>
                </tr>
            </thead>

            <tbody id="history"></tbody>

        </table>

        <button
            class="clear-history"
            onclick="clearHistory()"
        >
            Historie löschen
        </button>

    </div>


    <!-- =========================
         UHR
         ========================= -->

    <div class="card">

        <h2>Uhr</h2>

        <div id="clock">
            00:00:00
        </div>

        <div id="date">
            -
        </div>

    </div>


    <script>

        /* ========================================
           GRUNDEINSTELLUNGEN
           ======================================== */

        let counter = Number(
            localStorage.getItem("counter") || 0
        );

        let lastCounterChange = Number(
            localStorage.getItem("lastCounterChange") || Date.now()
        );


        /* ========================================
           COUNTER
           ======================================== */

        function updateCounter() {

            document.getElementById("counter").textContent = counter;

            localStorage.setItem(
                "counter",
                String(counter)
            );

            saveToday();
            showHistory();
            calculateValues();
        }


        function changeCounter(value) {

            counter += value;

            /*
             * Zeitpunkt der letzten Änderung speichern.
             * Dadurch beginnt der Timer bei jeder
             * Counteränderung wieder bei 00:00:00.
             */

            lastCounterChange = Date.now();

            localStorage.setItem(
                "lastCounterChange",
                String(lastCounterChange)
            );

            updateCounter();
            updateTimeSinceChange();
        }


        function resetCounter() {

            counter = 0;

            /*
             * Auch beim Zurücksetzen wird ein neuer
             * Änderungszeitpunkt gesetzt.
             */

            lastCounterChange = Date.now();

            localStorage.setItem(
                "lastCounterChange",
                String(lastCounterChange)
            );

            updateCounter();
            updateTimeSinceChange();
        }


        /* ========================================
           BERECHNUNG
           
           Schachtelpreis / Inhalt × Counter
           ======================================== */

        function calculateValues() {

            const value1 = Number(
                document.getElementById("value1").value
            );

            const value2 = Number(
                document.getElementById("value2").value
            );

            const resultElement =
                document.getElementById("calculationResult");


            /*
             * Keine gültigen Eingabewerte:
             */

            if (
                !Number.isFinite(value1) ||
                !Number.isFinite(value2) ||
                value2 <= 0
            ) {

                resultElement.textContent = "—";

                return;
            }


            const result =
                (value1 / value2) * counter;


            /*
             * Immer zwei Nachkommastellen.
             * Deutsches Dezimaltrennzeichen.
             */

            resultElement.textContent =
                result.toFixed(2).replace(".", ",") + " €";
        }


        /* ========================================
           ZEIT SEIT LETZTER ÄNDERUNG
           ======================================== */

        function updateTimeSinceChange() {

            const elapsed =
                Math.max(0, Date.now() - lastCounterChange);


            const totalSeconds =
                Math.floor(elapsed / 1000);


            const hours =
                Math.floor(totalSeconds / 3600);


            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );


            const seconds =
                totalSeconds % 60;


            const timeString =
                String(hours).padStart(2, "0") +
                ":" +
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0");


            document.getElementById(
                "timeSinceChange"
            ).textContent = timeString;
        }


        /* ========================================
           EINGABEWERTE LADEN
           ======================================== */

        function loadValues() {

            const value1 =
                localStorage.getItem("value1");

            const value2 =
                localStorage.getItem("value2");


            if (value1 !== null) {

                document.getElementById(
                    "value1"
                ).value = value1;

            }


            if (value2 !== null) {

                document.getElementById(
                    "value2"
                ).value = value2;

            }


            calculateValues();
        }


        /* ========================================
           EINGABEWERTE SPEICHERN
           ======================================== */

        function saveValues() {

            const value1 =
                document.getElementById("value1").value;

            const value2 =
                document.getElementById("value2").value;


            if (value1 !== "") {

                const number1 = Number(value1);

                if (Number.isFinite(number1) && number1 >= 0) {

                    localStorage.setItem(
                        "value1",
                        String(number1)
                    );

                }

            } else {

                localStorage.removeItem("value1");

            }


            if (value2 !== "") {

                const number2 = Math.trunc(Number(value2));

                if (
                    Number.isFinite(number2) &&
                    number2 > 0
                ) {

                    localStorage.setItem(
                        "value2",
                        String(number2)
                    );

                }

            } else {

                localStorage.removeItem("value2");

            }


            calculateValues();
        }


        /* ========================================
           HEUTIGES DATUM
           ======================================== */

        function getToday() {

            const now = new Date();

            return (
                now.getFullYear() +
                "-" +
                String(
                    now.getMonth() + 1
                ).padStart(2, "0") +
                "-" +
                String(
                    now.getDate()
                ).padStart(2, "0")
            );
        }


        /* ========================================
           HEUTIGEN COUNTER SPEICHERN
           ======================================== */

        function saveToday() {

            let history =
                JSON.parse(
                    localStorage.getItem("history") || "{}"
                );


            history[getToday()] = counter;


            localStorage.setItem(
                "history",
                JSON.stringify(history)
            );
        }


        /* ========================================
           HISTORIE ANZEIGEN
           ======================================== */

        function showHistory() {

            const history =
                JSON.parse(
                    localStorage.getItem("history") || "{}"
                );


            const table =
                document.getElementById("history");


            table.innerHTML = "";


            Object.keys(history)
                .sort()
                .reverse()
                .forEach(date => {

                    const row =
                        document.createElement("tr");


                    const dateCell =
                        document.createElement("td");


                    const valueCell =
                        document.createElement("td");


                    dateCell.textContent =
                        new Date(
                            date + "T12:00:00"
                        ).toLocaleDateString(
                            "de-DE"
                        );


                    valueCell.textContent =
                        history[date];


                    row.append(
                        dateCell,
                        valueCell
                    );


                    table.appendChild(row);
                });
        }


        /* ========================================
           HISTORIE LÖSCHEN
           ======================================== */

        function clearHistory() {

            if (
                confirm(
                    "Möchtest du die komplette Historie löschen?"
                )
            ) {

                localStorage.removeItem("history");

                /*
                 * Nach dem Löschen den aktuellen
                 * Tageswert wieder speichern.
                 */

                saveToday();
                showHistory();
            }
        }


        /* ========================================
           UHR
           ======================================== */

        function updateClock() {

            const now = new Date();


            document.getElementById("clock").textContent =
                now.toLocaleTimeString(
                    "de-DE",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );


            document.getElementById("date").textContent =
                now.toLocaleDateString(
                    "de-DE",
                    {
                        weekday: "long",
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    }
                );
        }


        /* ========================================
           EVENT LISTENER
           ======================================== */

        document
            .getElementById("value1")
            .addEventListener(
                "input",
                saveValues
            );


        document
            .getElementById("value2")
            .addEventListener(
                "input",
                saveValues
            );


        /* ========================================
           INITIALISIERUNG
           ======================================== */

        loadValues();

        updateCounter();

        updateTimeSinceChange();

        updateClock();

        showHistory();


        /* ========================================
           INTERVALLE
           ======================================== */

        /*
         * Uhr jede Sekunde aktualisieren.
         */

        setInterval(
            updateClock,
            1000
        );


        /*
         * Timer jede Sekunde aktualisieren.
         */

        setInterval(
            updateTimeSinceChange,
            1000
        );

    </script>

</body>
</html>
